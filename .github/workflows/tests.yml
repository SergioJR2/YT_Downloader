name: Tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Las pruebas no necesitan PyQt6: solo la lógica (errores, nombres, servicios)
      - run: pip install pytest "yt-dlp[default]" psutil
      - run: pytest -q
