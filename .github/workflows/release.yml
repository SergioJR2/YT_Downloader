name: Release

# Publica una release al subir un tag (p. ej. V1.5.1). El tag debe coincidir con
# APP_VERSION de models/config.py. También se puede lanzar a mano (Actions >
# Release > Run workflow): en una rama solo compila y deja los archivos como
# artefacto, sin publicar nada; sirve para probar el proceso antes de crear el tag.
on:
  push:
    tags: ["V*", "v*"]
  workflow_dispatch:
    inputs:
      include_ffmpeg:
        description: "Versión Completa (con ffmpeg). Desmárcalo para compilar la Ligera."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # "true"  = la release se crea como BORRADOR: la revisas, pruebas el instalador y
  #           pulsas "Publish release". Hasta entonces la app no la ve como
  #           actualización. Cámbialo a "false" cuando confíes en el proceso.
  # "false" = se publica sola y la app de tus usuarios la detecta enseguida.
  RELEASE_AS_DRAFT: "true"

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      # 1 = versión Completa (con ffmpeg), 0 = Ligera. Lo lee YT_Downloader.spec.
      YT_INCLUDE_FFMPEG: ${{ github.event.inputs.include_ffmpeg == 'false' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -U pyinstaller -r requirements.txt

      - name: Leer APP_VERSION
        id: ver
        run: |
          $v = (python -c "from models.config import APP_VERSION; print(APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $v) { throw "No se pudo leer APP_VERSION de models/config.py" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"

      - name: Verificar que el tag coincide con APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          APPVER: ${{ steps.ver.outputs.version }}
        run: |
          $tagVer = $env:TAG -replace '^[vV]', ''
          if ($tagVer -ne $env:APPVER) {
            throw "El tag '$($env:TAG)' no coincide con APP_VERSION '$($env:APPVER)'. Corrige models/config.py o el tag."
          }

      - name: Compilar .exe con PyInstaller
        run: |
          python -m PyInstaller YT_Downloader.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { throw "Falló PyInstaller" }
          if (-not (Test-Path dist\YT_Downloader.exe)) { throw "No se generó dist\YT_Downloader.exe" }

      - name: Instalar Inno Setup
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup" }

      - name: Crear instalador (Setup)
        env:
          APPVER: ${{ steps.ver.outputs.version }}
        run: |
          # Busca ISCC.exe en cualquier carpeta "Inno Setup*" (6, 7...), 32 o 64 bits
          $iscc = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) |
            ForEach-Object { Get-ChildItem $_ -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue } |
            ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "No se encontró ISCC.exe" }
          & $iscc "/DAppVersion=$($env:APPVER)" instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Falló Inno Setup" }

      - name: Generar SHA-256
        # La app solo se autoactualiza si la release publica el hash (<archivo>.sha256).
        # Se escribe con saltos de línea LF para que sha256sum -c lo pueda verificar.
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $files = [ordered]@{
            'dist\YT_Downloader.exe'             = 'YT_Downloader.exe'
            'instalador\YT_Downloader_Setup.exe' = 'YT_Downloader_Setup.exe'
          }
          foreach ($src in $files.Keys) {
            $name = $files[$src]
            Copy-Item $src "release\$name"
            $h = (Get-FileHash "release\$name" -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$PWD\release\$name.sha256", "$h  $name`n")
            "$name  $h"
          }

      # No bloquea la publicación: avisa si el .exe se cierra al abrirlo (por ejemplo
      # una DLL de Qt incompatible). Cuando veas que es estable, quita continue-on-error.
      - name: Prueba de arranque del .exe
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "$PWD\release\YT_Downloader.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "El .exe se cerró al iniciar (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          "El .exe arranca y sigue abierto tras 12 s."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YT_Downloader-${{ steps.ver.outputs.version }}${{ env.YT_INCLUDE_FFMPEG == '0' && '-ligero' || '' }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # Va aparte y con permiso de escritura: la compilación (que ejecuta paquetes de
  # pip) corre con permisos de solo lectura. Solo con un tag y solo la versión
  # Completa, que es la que espera el actualizador de la app.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.include_ffmpeg != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: YT_Downloader-${{ needs.build.outputs.version }}
          path: release

      - name: Verificar la integridad de los archivos
        run: cd release && sha256sum -c *.sha256

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          extra=()
          [ "$RELEASE_AS_DRAFT" = "true" ] && extra+=(--draft)
          [[ "$TAG" == *-* ]] && extra+=(--prerelease)   # p. ej. V1.6.0-beta1
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Reintento sobre una release que ya existe: solo reemplaza los archivos
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "YT Downloader ${TAG#[vV]}" --generate-notes "${extra[@]}"
          fi
