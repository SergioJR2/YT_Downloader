name: CI

# Pruebas en cada push a main y en cada Pull Request. release.yml también lo
# reutiliza (workflow_call) antes de compilar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -U -r requirements.txt pytest

      - name: Ejecutar pruebas
        run: python -m pytest tests -v
