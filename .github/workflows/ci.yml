name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install PyQt6 "yt-dlp[default]" imageio-ffmpeg psutil pytest

      - name: Ejecutar pruebas
        run: python -m pytest tests -v